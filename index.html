const faceLayout=[
  ['rotateY(0deg)',[5]],
  ['rotateY(90deg)',[1,9]],
  ['rotateX(90deg)',[1,5,9]],
  ['rotateX(-90deg)',[1,3,7,9]],
  ['rotateY(-90deg)',[1,3,5,7,9]],
  ['rotateY(180deg)',[1,3,4,6,7,9]]

const faceAngles=[[0,0],[0,-90],[-90,0],[90,0],[0,90],[0,180]];

function initDice(){
  for(let index=0;index<2;index++){
    const cube=document.createElement('div');
    cube.className='cube';
    for(const [rotation,pips] of faceLayout){
      const face=document.createElement('div');
      face.className='cube-face';
      face.style.setProperty('--face',rotation);
      for(let slot=1;slot<=9;slot++){
        const pip=document.createElement('i');
        if(pips.includes(slot))pip.dataset.pip='';
        face.append(pip);
      }
      cube.append(face);
    }
    $('cubes').append(cube);
  }
}

function renderPieces(){
  const layer=$('pieces');
  if(!S)return;
  if(layer.children.length!==S.players.length){
    layer.replaceChildren(...S.players.map((_,index)=>{
      const piece=document.createElement('span');
      piece.className='piece';
      piece.style.setProperty('--p',pcolors[index]);
      piece.innerHTML='<span class="piece-core"></span><b>'+(index+1)+'</b>';
      return piece;
    }));
  }
  S.players.forEach((player,index)=>{
    const piece=layer.children[index];
    const position=index===S.turn&&previewTile!==null?previewTile:player.pos;
    const [column,row]=loc(position);
    piece.hidden=player.out;
    piece.title=player.name;
    piece.classList.toggle('is-active',index===S.turn);
    piece.style.zIndex=index===S.turn?'2':'1';
    piece.style.setProperty('--x',((column-1)*70+8+(index%3)*18)+'px');
    piece.style.setProperty('--y',((row-1)*70+13+Math.floor(index/3)*16)+'px');
  });
}

function camera(speed=360){
  const stage=$('stage'),board=$('board');
  const w=stage.clientWidth,h=stage.clientHeight;
  const radians=angle*Math.PI/180;
  const cos=Math.cos(radians),sin=Math.sin(radians);
  const tiltCos=Math.cos(tilt*Math.PI/180);
  const width=980*Math.abs(cos)+560*Math.abs(sin);
  const height=(980*Math.abs(sin)+560*Math.abs(cos))*tiltCos;
  const fit=Math.max(.1,Math.min((w-32)/(width+55),(h-66)/(height+50)));
  const scale=focusTile===null?fit:Math.min(2.25,Math.max(fit*2.15,.88));
  let panX=0,panY=0;
  if(focusTile!==null){
    const [column,row]=loc(focusTile);
    const x=(column-.5)*70-490,y=(row-.5)*70-280;
    panX=-(x*cos-y*sin)*scale;
    panY=-(x*sin+y*cos)*scale*tiltCos;
  }
  board.style.setProperty('--camera-speed',(typeof speed==='number'?speed:360)+'ms');
  board.style.setProperty('--pan-x',panX+'px');
  board.style.setProperty('--pan-y',panY+'px');
  board.style.setProperty('--scale',scale);
  board.style.setProperty('--tilt',tilt+'deg');
  board.style.setProperty('--angle',angle+'deg');
}

function toggleFollow(){
  follow=!follow;
  if(!follow)focusTile=null;
  else if(S&&S.phase!=='over')focusTile=previewTile??current().pos;
  $('camFollow').setAttribute('aria-pressed',String(follow));
  $('camFollow').textContent=follow?'Takip açık':'Takip kapalı';
  camera();
}

function focusOn(tile,speed){
  if(!follow)return;
  focusTile=tile;
  camera(speed);
}

const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));

async function showDice(player,first,second){
  const overlay=$('rollOverlay');
  $('rollPlayer').textContent=player+' zar atıyor';
  $('rollResult').textContent='';
  overlay.hidden=false;
  const animations=[first,second].map((value,index)=>{
    const cube=$('cubes').children[index];
    const [x,y]=faceAngles[value-1];
    const result='rotateX('+x+'deg) rotateY('+y+'deg)';
    cube.style.setProperty('--rx',x+'deg');
    cube.style.setProperty('--ry',y+'deg');
    if(reducedMotion.matches||!cube.animate)return Promise.resolve();
    return cube.animate([
      {transform:'translateY(-43px) rotateX(-240deg) rotateY(110deg)',offset:0},
      {transform:'translateY(12px) rotateX(170deg) rotateY(285deg)',offset:.48},
      {transform:'translateY(-10px) rotateX(260deg) rotateY(330deg)',offset:.68},
      {transform:result,offset:1}
    ],{duration:780+index*110,easing:'cubic-bezier(.2,.62,.35,1)'}).finished.catch(()=>{});
  });
  await Promise.all(animations);
  $('rollPlayer').textContent=player+' zar attı';
  $('rollResult').textContent=first+' + '+second+' = '+(first+second);
  await pause(reducedMotion.matches?420:560);
  overlay.hidden=true;
}

async function roll(){
  if(moving||S.phase!=='roll')return;
  const player=current();
  const previous=player.pos;
  const first=1+Math.floor(Math.random()*6),second=1+Math.floor(Math.random()*6);
  const doubles=first===second;
  const goesToJail=!player.jailed&&doubles&&S.doubles===2;
  const walks=!goesToJail&&(!player.jailed||doubles||player.jail>=2);
  const stepTime=reducedMotion.matches?0:145;
  const stage=$('stage');
  const stageRect=stage.getBoundingClientRect();
  const scrollToBoard=stageRect.bottom<Math.min(stageRect.height*.65,window.innerHeight*.65)||stageRect.top>window.innerHeight-120;
  moving=true;
  clearTimeout(botTimer);
  S.msg=player.name+' zar atıyor…';
  focusOn(previous);
  render();
  if(!reducedMotion.matches&&follow)await pause(220);
  if(scrollToBoard)stage.scrollIntoView({block:'start',behavior:reducedMotion.matches?'instant':'smooth'});

  try{
    await showDice(player.name,first,second);
    S.dice=[first,second];
    if(walks){
      const distance=first+second;
      S.msg=player.name+' '+distance+' kare ilerliyor…';
      stage.style.setProperty('--piece-speed',stepTime+'ms');
      $('message').textContent=S.msg;
      $('round').textContent='Tur '+S.round+' · Toplam '+distance;
      for(let step=1;step<=distance;step++){
        if(!stepTime&&step<distance)continue;
        previewTile=(previous+step)%B.length;
        focusOn(previewTile,stepTime);
        renderPieces();
        if (step > 1) $('tile'+((previous+step-1)%B.length)).classList.remove('player-spot');
        else $('tile'+previous).classList.remove('player-spot');
        $('tile'+previewTile).classList.add('player-spot');
        if(stepTime)await pause(stepTime);
      }
    }
    const beforeResolution=previewTile??previous;
    applyRoll(first,second);
    previewTile=null;
    if(player.pos!==beforeResolution){
      focusOn(player.pos);
      renderBoard();
      if(!reducedMotion.matches)await pause(370);
    }
  }finally{
    $('rollOverlay').hidden=true;
    stage.style.removeProperty('--piece-speed');
    previewTile=null;
    moving=false;
    render();
    if(!player.bot&&S.phase!=='roll'){
      const controls=$('actions');
      const rect=controls.getBoundingClientRect();
      if(rect.top>window.innerHeight-45||rect.bottom<45){
        controls.scrollIntoView({block:'nearest',behavior:reducedMotion.matches?'instant':'smooth'});
      }
    }
  }
}

function arrive(to,after='land'){
  const player=current();

  player.pos=to;

  if(passed){
    player.cash+=200;

function draw(type){let deck=type==='chance'?chance:finance, pile=S[type];if(!pile.length)S[type]=shuffle(deck.map((_,i)=>i));let idx=S[type].shift();let [label,action,a,b]=deck[idx],v=current();S.card={type,label:label+(action==='cash'?` ${a>0?'+':'−'}${money(Math.abs(a))}`:'')};log(`${type==='chance'?'Kader':'Kenisel'}: ${S.card.label}`);if(action==='cash'){if(a<0){charge(-a,-1,label);return}v.cash+=a}else if(action==='move'){moveTo(a);return}else if(action==='jail'){goJail();return}else if(action==='discount')v.discount++;else if(action==='free')v.free++;else if(action==='permit')v.permit++;else if(action==='loan'){v.cash+=200;v.loan+=250}else if(action==='repair'){let cost=assets(S.turn).reduce((s,i)=>s+(S.props[i].h===5?b:S.props[i].h*a),0);charge(cost,-1,label);return}else if(action==='perland')v.cash+=a*assets(S.turn).filter(i=>B[i].type==='land').length;else if(action==='pertransit'){charge(-a*assets(S.turn).filter(i=>B[i].type==='transit').length,-1,label);return}else if(action==='collect'){for(let id of alive().filter(i=>i!==S.turn)){let o=S.players[id];liquidate(id,a);if(o.cash>=a){o.cash-=a;v.cash+=a}else if(bankrupt(id,S.turn))return}}finish()}
function applyRoll(d1,d2){const v=current(),same=d1===d2;S.dice=[d1,d2];S.card=null;log(`${v.name} zar attı: ${d1} + ${d2}.`);if(v.jailed){v.jail++;S.extra=false;if(same){v.jailed=false;v.jail=0;moveTo((v.pos+d1+d2)%40);return}if(v.jail>=3){v.jailed=false;v.jail=0;arrive((v.pos+d1+d2)%40,'jailFee');return}phase('end');S.msg='Çift zar gelmedi. Cezaevinde kalıyorsun.';return}S.doubles=same?S.doubles+1:0;S.extra=same;if(S.doubles===3){goJail();return}moveTo((v.pos+d1+d2)%40)}
function jailExit(card){let v=current();if(S.phase!=='roll'||!v.jailed)return;if(card){if(!v.free)return;v.free--}else{if(v.cash<50)return;v.cash-=50}v.jailed=false;v.jail=0;log(`${v.name} cezaevinden çıktı.`);S.msg='Zar atabilirsin.'}
function buy(){if(S.phase!=='buy')return;let i=current().pos,b=B[i];if(current().cash<b.price)return;current().cash-=b.price;S.props[i].owner=S.turn;log(`${current().name}, ${b.name} mülkünü ${money(b.price)} karşılığında aldı.`);finish()}
function auctionStart(){if(S.phase!=='buy')return;let order=alive();let start=order.indexOf(S.turn);order=[...order.slice(start),...order.slice(0,start)];S.auction={i:current().pos,bid:0,high:-1,order,at:0,passed:[]};phase('auction');auctionCheck()}
function auctionCheck(){let a=S.auction,eligible=a.order.filter(i=>!a.passed.includes(i));if(!eligible.length||(eligible.length===1&&a.high===eligible[0])){if(a.high>=0){S.players[a.high].cash-=a.bid;S.props[a.i].owner=a.high;log(`${S.players[a.high].name} açık artırmada ${B[a.i].name} mülkünü ${money(a.bid)} bedelle aldı.`)}else log('Açık artırmada teklif verilmedi.');S.auction=null;finish();return}for(let z=0;z<a.order.length;z++){let id=a.order[a.at];if(!a.passed.includes(id)&&id!==a.high){S.msg=`Açık artırma: ${B[a.i].name}. Sıra ${S.players[id].name}.`;return}a.at=(a.at+1)%a.order.length}}
function auctionAct(amount){if(S.phase!=='auction')return;let a=S.auction,id=a.order[a.at];if(amount===null)a.passed.push(id);else{amount=Math.floor(amount);if(!Number.isFinite(amount)||amount<a.bid+1||amount>S.players[id].cash)return;a.bid=amount;a.high=id;log(`${S.players[id].name}: ${money(amount)} teklif verdi.`)}a.at=(a.at+1)%a.order.length;auctionCheck()}
function nextTurn(){if(S.phase==='over')return;let old=S.turn;for(let i=1;i<=S.players.length;i++){let j=(old+i)%S.players.length;if(!S.players[j].out){S.turn=j;if(j<=old)S.round++;break}}S.phase='roll';S.doubles=0;S.extra=false;S.card=null;S.debt=null;S.msg='Zar atarak turuna başla.';selected=current().pos;focusTile=null;camera()}

function tradable(i,id){let b=B[i];return S.props[i].owner===id&&(b.type!=='land'||group(b.g).every(j=>!S.props[j].h))}
function trade(){if(!isHuman()||!['roll','end','debt','buy'].includes(S.phase))return;let id=S.turn,others=alive().filter(i=>i!==id);if(!others.length)return;const options=(who)=>'<option value="-1">Mülk yok</option>'+assets(who).filter(i=>tradable(i,who)).map(i=>`<option value="${i}">${esc(B[i].name)}${S.props[i].mort?' (ipotekli)':''}</option>`).join('');modal(`<h2>Takas masası</h2><label for="partner">Rakip oyuncu</label><select id="partner">${others.map(i=>`<option value="${i}">${esc(S.players[i].name)}</option>`).join('')}</select><div class="setupgrid"><div><label for="give">Verdiğin mülk</label><select id="give">${options(id)}</select><label for="giveCash">Verdiğin nakit (₺)</label><input id="giveCash" type="number" min="0" value="0"></div><div><label for="take">Alacağın mülk</label><select id="take"></select><label for="takeCash">Alacağın nakit (₺)</label><input id="takeCash" type="number" min="0" value="0"></div></div><p id="tradeNote"></p><div class="actions"><button class="primary" id="offer">Teklif et</button><button id="cancel">Vazgeç</button></div>`);const refresh=()=>{$('take').innerHTML=options(+$('partner').value)};$('partner').onchange=refresh;refresh();$('cancel').onclick=()=>{close();render()};$('offer').onclick=()=>{let j=+$('partner').value,g=+$('give').value,t=+$('take').value,gc=+$('giveCash').value,tc=+$('takeCash').value;let me=S.players[id],other=S.players[j];if(![gc,tc].every(n=>Number.isInteger(n)&&n>=0)||gc>me.cash||tc>other.cash||(g<0&&t<0&&gc===tc)){$('tradeNote').textContent='Geçerli ve ödenebilir bir teklif gir.';return}const accept=()=>{me.cash+=tc-gc;other.cash+=gc-tc;if(g>=0)S.props[g].owner=j;if(t>=0)S.props[t].owner=id;log(`${me.name} ve ${other.name} takas yaptı.`);close();render()};if(other.bot){let value=(i,who)=>i<0?0:B[i].price*(S.props[i].mort?.5:1)*(B[i].type==='land'&&group(B[i].g).some(k=>k!==i&&S.props[k].owner===who)?1.45:1);if(gc+value(g,j)>=tc+value(t,j)*1.12&&other.cash-tc+gc>=70)accept();else $('tradeNote').textContent='Rakip teklifi reddetti. Daha iyi bir teklif dene.'}else{modal(`<h2>${esc(other.name)}, teklifi onaylıyor musun?</h2><p>${esc(me.name)} sana ${g>=0?esc(B[g].name):'mülk yok'} + ${money(gc)} veriyor. Karşılığında ${t>=0?esc(B[t].name):'mülk yok'} + ${money(tc)} istiyor.</p><div class="actions"><button class="primary" id="yes">Kabul et</button><button id="no">Reddet</button></div>`);$('yes').onclick=accept;$('no').onclick=()=>{close();render()}}}}
function button(label,fn,opts={}){let b=document.createElement('button');b.textContent=label;b.disabled=!!opts.disabled;b.className=opts.kind||'';b.onclick=()=>{if(moving)return;fn();if($('overlay').hidden)render()};return b}
function renderDetail(){let b=B[selected],p=S?.props[selected];let html=`<strong>${esc(b.name)}</strong>`;if(ownable(b)){let owner=p?.owner>=0?esc(S.players[p.owner].name):'Banka';html+=`<div class="info" style="margin-top:8px"><span>Satın alma</span><b>${money(b.price)}</b><span>Sahibi</span><b>${owner}</b><span>İpotek değeri</span><b>${money(b.price/2)}</b>`;if(b.type==='land'){html+=`<span>Ev / otel yapım bedeli</span><b>${money(buildCost(b.g))}</b><span>Boş arsa / tam grup</span><b>${money(b.price*.1)} / ${money(b.price*.2)}</b>`;[.25,.6,1.2,1.8,2.5].forEach((r,i)=>html+=`<span>${i===4?'Otel':(i+1)+' ev'}</span><b>${money(b.price*r)}</b>`)}else html+=`<span>Kira</span><b>${b.type==='transit'?'25 / 50 / 100 / 200':'Zar × 4 / 10'}</b>`;if(p?.owner>=0)html+=`<span>Mevcut kira</span><b>${money(rent(selected))}</b>`;html+='</div>'}else html+=`<p class="hint">${({start:'Geç veya üzerine gel: 200 ₺ al.',tax:'Bankaya '+money(b.price||0)+' öde.',jail:'Ziyaret veya tutukluluk.',park:'Ücretsiz dinlenme alanı.',gojail:'Doğrudan cezaevine git.',chance:'Kader kartı çek.',finance:'Kenisel kartı çek.'})[b.type]||''}</p>`;$('detail').innerHTML=html+'<div class="assetbtns" id="assetbtns"></div>';if(S&&isHuman()&&['roll','end','debt','buy'].includes(S.phase)&&p.owner===S.turn){let a=$('assetbtns');if(b.type==='land'){a.append(button('Ev / otel yap',()=>build(selected),{disabled:!canBuild(selected)||S.phase==='debt'}),button('Bina sat',()=>sell(selected),{disabled:!canSell(selected)}))}a.append(p.mort?button('İpoteği kaldır',()=>unmortgage(selected),{disabled:current().cash<releaseCost(selected)||S.phase==='debt'}):button('İpotek et',()=>mortgage(selected),{disabled:!canMortgage(selected)}))}}
function render(){clearTimeout(botTimer);renderBoard();renderDetail();if(!S)return;let v=current();$('turnPrompt').hidden=moving||v.bot||S.phase!=='roll';$('promptPlayer').textContent=v.name+' sırası';for(const id of ['saveBtn','newBtn','rulesBtn'])$(id).disabled=moving;$('players').innerHTML=S.players.map((p,i)=>`<div class="player ${i===S.turn?'active':''}"><span class="dot" style="--p:${pcolors[i]}"></span><span>${esc(p.name)}<small>${p.out?'İflas':(p.bot?'Bilgisayar · ':'')+assets(i).length+' mülk'+(p.jailed?' · Cezaevi':'')}${p.loan?' · Kredi '+money(p.loan):''}</small></span><span class="cash">${money(p.cash)}</span></div>`).join('');$('turntitle').textContent=S.phase==='over'?'Oyun bitti':v.name+' sırası';$('round').textContent='Tur '+S.round+' · Toplam '+(S.dice[0]+S.dice[1]);$('die1').textContent='⚀⚁⚂⚃⚄⚅'[S.dice[0]-1];$('die2').textContent='⚀⚁⚂⚃⚄⚅'[S.dice[1]-1];$('message').textContent=S.msg;$('cardpop').innerHTML=S.card?`<div class="cardpop ${S.card.type}"><b>${S.card.type==='chance'?'KADER':'KENİSEL'}</b><div>${esc(S.card.label)}</div></div>`:'';$('log').innerHTML=S.log.map(t=>`<div>${esc(t)}</div>`).join('');let port=$('portfolio');port.innerHTML='';for(let i of assets(S.turn)){let el=button(`${B[i].name}${S.props[i].h?' · '+(S.props[i].h===5?'otel':S.props[i].h+' ev'):''}${S.props[i].mort?' · ipotekli':''}`,()=>{selected=i});el.className='asset';el.style.setProperty('--c',stripe(B[i]));port.append(el)}if(!port.children.length)port.innerHTML='<span class="hint">Henüz mülk yok.</span>';let a=$('actions');a.innerHTML='';if(moving)return;if(S.phase==='over'){a.append(button('Yeni oyun',setup,{kind:'primary'}));return}if(S.phase==='auction'){let au=S.auction,id=au.order[au.at],bidder=S.players[id];$('message').textContent=`${B[au.i].name} · En yüksek: ${money(au.bid)} · Teklif sırası: ${bidder.name}`;if(bidder.bot){botTimer=setTimeout(botStep,500);return}let inp=document.createElement('input');inp.type='number';inp.min=au.bid+1;inp.max=bidder.cash;inp.value=Math.min(bidder.cash,au.bid+10);inp.style.width='100%';a.append(inp,button('Teklif ver',()=>auctionAct(+inp.value),{kind:'primary',disabled:bidder.cash<=au.bid}),button('Pas',()=>auctionAct(null)));return}if(v.bot){a.append(Object.assign(document.createElement('span'),{className:'hint',textContent:'Bilgisayar oynuyor…'}));botTimer=setTimeout(botStep,650);return}if(S.phase==='roll'){if(v.jailed){a.append(button('50 ₺ öde',()=>jailExit(false),{disabled:v.cash<50}),button('Çıkış kartı',()=>jailExit(true),{disabled:!v.free}))}}else if(S.phase==='buy'){a.append(button('Satın al · '+money(B[v.pos].price),buy,{kind:'primary',disabled:v.cash<B[v.pos].price}),button('Açık artırma',auctionStart))}else if(S.phase==='end'){a.append(button('Turu bitir',nextTurn,{kind:'primary'}))}else if(S.phase==='debt'){a.append(button('Borcu öde',payDebt,{kind:'primary',disabled:v.cash<S.debt.amount}),button('İflas / tasfiye',declare,{kind:'danger'}))}a.append(button('Takas',trade));if(v.free||v.discount||v.permit){let s=document.createElement('div');s.className='hint';s.style.width='100%';s.textContent=`Kartlar: ${v.free} çıkış · ${v.discount} kira indirimi · ${v.permit} imar izni`;a.append(s)}}
function botStep(){if(moving||!S||!$('overlay').hidden||S.phase==='over')return;if(S.phase==='auction'){let a=S.auction,id=a.order[a.at],v=S.players[id],b=B[a.i],fav=b.type==='land'&&group(b.g).some(j=>S.props[j].owner===id),cap=Math.min(v.cash-90,Math.floor(b.price*(fav?1.2:.95)));let amount=a.bid+Math.max(1,Math.min(10,cap-a.bid));auctionAct(cap>=a.bid+1?amount:null);render();return}let v=current();if(!v.bot)return;if(S.phase==='roll'){if(v.jailed&&(v.free||v.cash>350))jailExit(!!v.free);roll()}else if(S.phase==='buy'){let b=B[v.pos],fav=b.type==='land'&&group(b.g).some(j=>S.props[j].owner===S.turn);if(v.cash>=b.price+(fav?80:180))buy();else auctionStart()}else if(S.phase==='debt'){liquidate(S.turn,S.debt.amount);if(v.cash>=S.debt.amount)payDebt();else declare()}else if(S.phase==='end'){for(let i of assets(S.turn)){if(v.cash>releaseCost(i)+300&&S.props[i].mort)unmortgage(i);if(canBuild(i)&&v.cash>buildCost(B[i].g)+300){build(i);break}}nextTurn()}render()}
$('promptRoll').onclick=roll;$('saveBtn').onclick=save;$('newBtn').onclick=setup;$('rulesBtn').onclick=()=>{modal(`<h2>Nasıl oynanır?</h2><p>2–6 oyuncu, kişi başı 1.500 ₺. Sırayla iki zar atılır. Başlangıçtan geçildiğinde 200 ₺ alınır. Sahipsiz mülkü al veya açık artırmaya çıkar. Rakip mülkünde kira öde.</p><p>Bir renk grubunun tüm arsalarını alıp ipoteklerini kaldırınca eşit şekilde ev yap. Dört evden sonra aynı bedelle otel yap. Evler yarı bedelle satılır. Boş gruptaki mülkler yarı fiyatına ipotek edilebilir; %10 faizle geri alınır. Küsuratlı tutarlar tam liraya yuvarlanır.</p><p>Çift zar tekrar oynatır; üst üste üç çift cezaevi. Cezaevinden 50 ₺, çıkış kartı veya çift zar ile çıkılır; üçüncü başarısız zar sonunda 50 ₺ ödenir. Kader ve Kenisel kartları otomatik uygulanır. Kredi sonraki Başlangıç geçişinde ödenir. Ödeme yapılamazsa bina satışı, ipotek ve takas yapılabilir. Son kalan kazanır.</p><p>Arkadaşlarla aynı cihazda sıra ile oynayabilirsin. Bilgisayar rakipleri mülk alır, teklif verir, takas değerlendirir ve bina yapar. İflasta alacaklıya kalan mülkler devredilir; banka alacaklıysa mülkler satışa döner.</p><button id="closeRules" class="primary">Kapat</button>`);$('closeRules').onclick=()=>{close();render()}};$('camL').onclick=()=>{angle-=12;camera()};$('camR').onclick=()=>{angle+=12;camera()};$('camFlat').onclick=()=>{tilt=tilt?0:30;if(!tilt)angle=0;camera()};$('camReset').onclick=()=>{angle=-7;tilt=30;focusTile=null;camera()};$('camFollow').onclick=toggleFollow;new ResizeObserver(camera).observe($('stage'));initDice();initBoard();camera();renderBoard();renderDetail();setup();
</script></body></html>
