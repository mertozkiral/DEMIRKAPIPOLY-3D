:root{color-scheme:dark;--panel:#1b2a38;--line:#425563}
body{font-family:system-ui,"Segoe UI",sans-serif}
header{padding:14px clamp(14px,3vw,30px)}
button,select,input{min-height:40px}
button:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.layout{max-width:1680px;margin:auto;align-items:start}
.side{background:#111d29;padding:14px;min-width:0}
.section{padding:14px;background:linear-gradient(145deg,#223342,var(--panel))}

.actions button{min-width:105px}

.modal{max-height:min(85dvh,720px);padding:clamp(15px,4vw,24px)}

.board{margin-top:0;transform:translate(var(--pan-x,0px),var(--pan-y,0px)) rotateX(var(--tilt,30deg)) rotateZ(var(--angle,-7deg)) scale(var(--scale,.8));transition:transform var(--camera-speed,360ms) cubic-bezier(.22,.75,.25,1)}
.piece-layer{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}

.piece::before{content:"";position:absolute;z-index:-1;inset:0 2px 3px;background:radial-gradient(circle at 35% 21%,#fff9 0 11%,transparent 45%),linear-gradient(125deg,var(--p) 30%,#172432);border:1px solid #fff8;border-radius:50% 50% 36% 36%;box-shadow:2px 4px 2px #0008}
.piece::after{content:"";position:absolute;z-index:-2;bottom:0;width:100%;height:8px;border-radius:50%;background:linear-gradient(var(--p),#263544);box-shadow:2px 4px 2px #0008}
.piece.is-active::before{border-color:#fff;box-shadow:0 0 0 2px #f5cd82,2px 4px 2px #0008}
.tile.player-spot{box-shadow:inset 0 0 0 3px var(--gold)}
.house{clip-path:none;position:relative;width:10px;height:9px;margin-top:4px;background:linear-gradient(95deg,#79bd89 55%,#216347 56%);box-shadow:2px 2px #182c235e}
.house::before{content:"";position:absolute;inset:-5px -1px auto;height:6px;background:linear-gradient(115deg,#d69661 49%,#75402d 50%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hotel{width:19px;height:12px;background:repeating-linear-gradient(90deg,#9a5347 0 3px,#edab7e 3px 5px);border:1px solid #652f2a}
.hotel::before{background:linear-gradient(115deg,#cf6b57 49%,#753832 50%)}
.roll-overlay{position:absolute;z-index:25;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at center,#0a1729eb,#0a172970 68%,transparent);pointer-events:none;text-align:center;color:#fff1d5;padding:15px}
.roll-overlay[hidden]{display:none}

.cubes{display:flex;gap:32px;perspective:450px;padding:12px 28px}
.cube{--half:24px;position:relative;width:calc(2 * var(--half));height:calc(2 * var(--half));transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry))}

const manualSaveKey='demirkapipoly-v5',autoSaveKey='demirkapipoly-auto-v4';
const gamePhases=new Set(['roll','buy','auction','end','debt','over']);
let lastCheckpoint='';

function readGameSave(key){
  try{
    const data=JSON.parse(localStorage.getItem(key));
    const state=data?.game??data;
    if(!state||!Array.isArray(state.players)||state.players.length<2||state.players.length>6||
      !Array.isArray(state.props)||state.props.length!==B.length||!gamePhases.has(state.phase)||
      !Number.isInteger(state.turn)||!state.players[state.turn]||
      !Array.isArray(state.dice)||state.dice.length!==2||!state.dice.every(die=>Number.isInteger(die)&&die>=1&&die<=6)||
      !['log','chance','finance'].every(name=>Array.isArray(state[name])))return null;
    if(!state.players.every(player=>player&&typeof player.name==='string'&&Number.isFinite(player.cash)&&
      Number.isInteger(player.pos)&&player.pos>=0&&player.pos<B.length))return null;
    if(!state.props.every(property=>property&&Number.isInteger(property.owner)&&property.owner>=-1&&
      property.owner<state.players.length&&Number.isInteger(property.h)&&property.h>=0&&property.h<=5))return null;
    if(state.phase==='auction'){
      const auction=state.auction;
      if(!auction||!B[auction.i]||!Array.isArray(auction.order)||!Array.isArray(auction.passed)||
        !state.players[auction.order[auction.at]]||!Number.isFinite(auction.bid))return null;
    }
    if(state.phase==='debt'&&(!state.debt||!Number.isFinite(state.debt.amount)))return null;
    return {state,landing:data?.game?data.landing:null,charge:data?.game?data.charge:null};
  }catch{return null}
}

function checkpointGame(){
  if(!S||moving)return;
  try{
    const encoded=JSON.stringify({game:S,landing:landingTile,charge:landingCharge});
    if(encoded===lastCheckpoint)return;
    localStorage.setItem(autoSaveKey,encoded);
    lastCheckpoint=encoded;
  }catch{}
}

function save(){
  if(!S||moving)return;
  try{
    localStorage.setItem(manualSaveKey,JSON.stringify({game:S,landing:landingTile,charge:landingCharge}));
    toast('Oyun bu tarayıcıya kaydedildi.');
  }catch{toast('Tarayıcı kaydetmeye izin vermedi.')}
}

function load(key=manualSaveKey){
  if(moving)return;
  const snapshot=readGameSave(key);
  if(!snapshot){toast('Kayıt açılamadı.');return}
  resetGameView();
  finishDecision(false,false);
  S=snapshot.state;
  if(Object.hasOwn(gamePaces,S.pace))paceName=S.pace;
  else S.pace=paceName;
  if(typeof S.rollShown!=='boolean')S.rollShown=S.phase!=='roll'||!!S.extra;
  lastCheckpoint='';
  if(follow)focusOn(current().pos);
  selected=current().pos;
  const savedTile=snapshot.landing;
  landingTile=Number.isInteger(savedTile)&&B[savedTile]?savedTile:
    ['buy','auction','end','debt'].includes(S.phase)?selected:null;
  landingCharge=snapshot.charge;
  close();
  render();
}

function camera(speed=360){
  const stage=$('stage'),board=$('board');
  const w=stage.clientWidth,h=stage.clientHeight;
  const radians=angle*Math.PI/180;
  const cos=Math.cos(radians),sin=Math.sin(radians);
  const tiltCos=Math.cos(tilt*Math.PI/180);
  const width=980*Math.abs(cos)+560*Math.abs(sin);
  const height=(980*Math.abs(sin)+560*Math.abs(cos))*tiltCos;
  const fit=Math.max(.1,Math.min((w-32)/(width+55),(h-Math.min(h*.33,135))/(height+50)));
  const cameraTile=wholeBoard||!follow||diceCamera?null:focusTile;
  const diceTarget=diceCamera&&!diceCamera.showOverview?diceCamera.target:null;
  const scale=diceTarget?Math.max(.1,Math.min(2.65,(w-32)/(diceCamera.span+95),Math.max(fit*3.25,1.25))):diceCamera?fit:cameraTile===null?fit*manualZoom:Math.min(2.65,Math.max(fit*2.15,.88)*manualZoom);
  let panX=0,panY=0;
  if(diceTarget||cameraTile!==null){
    const [column,row]=diceTarget?[0,0]:loc(cameraTile);
    const [x,y]=diceTarget??[(column-.5)*70-490,(row-.5)*70-280];
    panX=-(x*cos-y*sin)*scale;
    panY=-(x*sin+y*cos)*scale*tiltCos;
  }
  board.style.setProperty('--camera-speed',(typeof speed==='number'?speed:360)+'ms');
  board.style.setProperty('--pan-x',panX+'px');
  board.style.setProperty('--pan-y',panY+'px');
  board.style.setProperty('--scale',scale);
  board.style.setProperty('--tilt',tilt+'deg');
  board.style.setProperty('--angle',angle+'deg');
  $('camFlat').setAttribute('aria-pressed',String(tilt!==0));
  const canReturn=wholeBoard&&follow&&S&&S.phase!=='over';
  $('camReset').textContent=diceCamera?(diceCamera.showOverview?'Zara dön':'Tahtayı göster'):canReturn?'Piyona dön':'Tahtayı göster';
  $('camReset').setAttribute('aria-pressed',String(diceCamera?!!diceCamera.showOverview:wholeBoard));
}

function initOrbit(){
  const stage=$('stage');
  stage.addEventListener('pointerdown',event=>{
    if(moving||event.button!==0||!event.isPrimary||event.target.closest('button,select,label,.camera,.turn-cue'))return;
    orbitDrag={id:event.pointerId,x:event.clientX,y:event.clientY,angle,tilt,dragging:false};
  });
  stage.addEventListener('pointermove',event=>{
    if(!orbitDrag||orbitDrag.id!==event.pointerId)return;
    const dx=event.clientX-orbitDrag.x,dy=event.clientY-orbitDrag.y;
    if(!orbitDrag.dragging){
      if(Math.hypot(dx,dy)<7)return;
      orbitDrag.dragging=true;
      stage.setPointerCapture(event.pointerId);
      stage.classList.add('is-orbiting');
    }
    angle=(orbitDrag.angle+dx*.34)%360;
    tilt=Math.max(0,Math.min(66,orbitDrag.tilt+dy*.27));
    camera(0);
  });
  const endOrbit=event=>{
    if(orbitDrag?.id!==event.pointerId)return;
    if(orbitDrag.dragging)orbitClickUntil=Date.now()+180;
    orbitDrag=null;
    stage.classList.remove('is-orbiting');
  };
  stage.addEventListener('pointerup',endOrbit);
  stage.addEventListener('pointercancel',endOrbit);
  stage.addEventListener('lostpointercapture',endOrbit);
  stage.addEventListener('pointerleave',event=>{
    if(!stage.hasPointerCapture(event.pointerId))endOrbit(event);
  });
}

const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));


const diceHalf=26;
const diceInertia=(diceHalf*2)**2/6;
const dieNormals=[[0,0,1],[1,0,0],[0,-1,0],[0,1,0],[-1,0,0],[0,0,-1]];
const dieCorners=[-diceHalf,diceHalf].flatMap(x=>[-diceHalf,diceHalf].flatMap(y=>[-diceHalf,diceHalf].map(z=>[x,y,z])));
let diceCamera=null;

const dot=(a,b)=>a.reduce((sum,value,i)=>sum+value*b[i],0);
const cross=([x,y,z],[a,b,c])=>[y*c-z*b,z*a-x*c,x*b-y*a];
const scaled=(v,n)=>v.map(value=>value*n);
const plus=(a,b)=>a.map((value,i)=>value+b[i]);
function unit(v){return scaled(v,1/(Math.hypot(...v)||1))}

function multiplyRotation(a,b){
  const [x,y,z,w]=a,[i,j,k,t]=b;
  return [w*i+x*t+y*k-z*j,w*j-x*k+y*t+z*i,w*k+x*j-y*i+z*t,w*t-x*i-y*j-z*k];
}
function rotation(axis,angle){
  return [...scaled(unit(axis),Math.sin(angle/2)),Math.cos(angle/2)];
}
function rotateVector(q,v){
  const axis=q.slice(0,3);
  const t=scaled(cross(axis,v),2);
  return plus(v,plus(scaled(t,q[3]),cross(axis,t)));
}
function randomBetween(low,high){return low+Math.random()*(high-low)}

function makeRigidDie(side){
  const axis=[randomBetween(-1,1),randomBetween(-1,1),randomBetween(-1,1)];
  return {
    p:[-337-side*13,side*randomBetween(39,63),randomBetween(80,105)],
    v:[randomBetween(352,427),-side*randomBetween(9,23),randomBetween(82,134)],
    q:rotation(axis,randomBetween(0,Math.PI*2)),
    w:[randomBetween(3,13)*side,randomBetween(8,17),randomBetween(-9,9)]
  };
}

function applyDieImpulse(die,arm,impulse){
  die.v=plus(die.v,impulse);
  die.w=plus(die.w,scaled(cross(arm,impulse),1/diceInertia));
}

function stepRigidDie(die,dt){
  let impactSpeed=0;
  die.v[2]-=1050*dt;
  die.v=scaled(die.v,Math.exp(-.12*dt));
  die.p=plus(die.p,scaled(die.v,dt));
  const spin=Math.hypot(...die.w);
  if(spin>.0001)die.q=unit(multiplyRotation(rotation(die.w,spin*dt),die.q));
  const corners=dieCorners.map(corner=>rotateVector(die.q,corner));
  const low=Math.min(...corners.map(corner=>corner[2]));
  if(die.p[2]+low<=.04){
    const up=[0,0,1];
    die.p[2]=-low+.04;
    const contact=corners.filter(corner=>corner[2]-low<1.15);
    const arm=scaled(contact.reduce(plus,[0,0,0]),1/contact.length);
    const incoming=plus(die.v,cross(die.w,arm));
    if(incoming[2]<0){
      impactSpeed=-incoming[2];
      const angular=cross(arm,up);
      const bounce=incoming[2]<-52?.4:.02;
      const strength=-(1+bounce)*incoming[2]/(1+dot(angular,angular)/diceInertia);
      applyDieImpulse(die,arm,scaled(up,strength));
      const slip=[incoming[0],incoming[1],0],speed=Math.hypot(...slip);
      if(speed>.01){
        const direction=scaled(slip,-1/speed);
        const twist=cross(arm,direction);
        const friction=Math.min(.46*strength,speed/(1+dot(twist,twist)/diceInertia));
        applyDieImpulse(die,arm,scaled(direction,friction));
      }
    }
    die.v[0]*=.977;
    die.v[1]*=.977;
    die.w=scaled(die.w,.977);
  }
  for(const dimension of [0,1]){
    const extent=Math.max(...corners.map(corner=>Math.abs(corner[dimension])));
    const limit=(dimension===0?474:265)-extent;
    if(Math.abs(die.p[dimension])>limit){
      const side=Math.sign(die.p[dimension]);
      die.p[dimension]=side*limit;
      if(side*die.v[dimension]>0)die.v[dimension]*=-.37;
      die.w=scaled(die.w,.8);
    }
  }
  return impactSpeed;
}

function collideDice(a,b){
  const delta=[b.p[0]-a.p[0],b.p[1]-a.p[1],0];
  const distance=Math.hypot(...delta);
  if(distance>=diceHalf*2||distance<.001||Math.abs(a.p[2]-b.p[2])>diceHalf*1.7)return;
  const normal=scaled(delta,1/distance);
  const correction=scaled(normal,(diceHalf*2-distance)/2);
  a.p=plus(a.p,scaled(correction,-1));
  b.p=plus(b.p,correction);
  const speed=dot(plus(b.v,scaled(a.v,-1)),normal);
  if(speed>=0)return;
  const impulse=scaled(normal,-speed*.67);
  applyDieImpulse(a,scaled(normal,diceHalf),scaled(impulse,-1));
  applyDieImpulse(b,scaled(normal,-diceHalf),impulse);
}

function settleDie(die){
  const normals=dieNormals.map(normal=>rotateVector(die.q,normal));
  const face=normals.reduce((best,normal,i)=>normal[2]>normals[best][2]?i:best,0);
  const up=normals[face];
  const axis=cross(up,[0,0,1]);
  if(Math.hypot(...axis)>.0001){
    const angle=Math.acos(Math.max(-1,Math.min(1,up[2])));
    die.q=unit(multiplyRotation(rotation(axis,angle),die.q));
  }
  die.p[2]=diceHalf+.04;
  return face+1;
}

function dieTransform(die){
  const q=die.q[3]<0?scaled(die.q,-1):die.q;
  const [x,y,z,w]=q;
  // A matrix avoids axis-angle interpolation jumping across a full rotation.
  const matrix=[
    1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),0,
    2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),0,
    2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y),0,
    die.p[0]-diceHalf,die.p[1]-diceHalf,die.p[2],1
  ];
  return 'matrix3d('+matrix.map(value=>value.toFixed(5)).join(',')+')';
}

function simulateToss(){
  const bodies=[makeRigidDie(-1),makeRigidDie(1)];
  const paths=bodies.map(die=>[{transform:dieTransform(die)}]);
  const dt=1/120,impacts=[],lastContact=[-1,-1];
  for(let tick=1;tick<=300;tick++){
    bodies.forEach((die,index)=>{
      const speed=stepRigidDie(die,dt),time=tick/300*2.66;
      if(speed>78&&time-lastContact[index]>.085){
        impacts.push({time,speed});
        lastContact[index]=time;
      }
    });
    collideDice(...bodies);
    if(tick%2===0)bodies.forEach((die,i)=>paths[i].push({transform:dieTransform(die)}));
  }
  const values=bodies.map(settleDie);
  bodies.forEach((die,i)=>paths[i].push({transform:dieTransform(die)}));
  const [x,y]=scaled(plus(bodies[0].p,bodies[1].p),.5);
  const span=Math.hypot(bodies[1].p[0]-bodies[0].p[0],bodies[1].p[1]-bodies[0].p[1]);
  return {values,paths,target:[x,y],span,bodies,impacts};
}

function simulateDice(){
  let best=null,bestDistance=Infinity;
  for(let attempt=0;attempt<12;attempt++){
    const result=simulateToss();
    const distance=Math.max(...result.bodies.map(die=>Math.hypot(die.p[0],die.p[1])));
    if(distance<=165&&result.span<=175)return result;
    if(distance<bestDistance){best=result;bestDistance=distance}
  }
  return best;
}

async function roll(){

  const player=current();
  if(!player.bot){
    recordSeatAction(S.turn);

    suspendBrowsing(S.turn);
  }

  if(tradeOpen)close();
  const previous=player.pos;
  const throwResult=simulateDice();
  const [first,second]=throwResult.values;
  const doubles=first===second;
  const goesToJail=!player.jailed&&doubles&&S.doubles===2;
  const walks=!goesToJail&&(!player.jailed||doubles||player.jail>=2);
  const manual=paceName==='manual'&&!player.bot;
  const pace=gamePaces[manual||paceName!=='manual'?paceName:'slow'];

      }

  }

function charge(amount,creditor=-1,why='',after='finish'){

  const player=current(),reason=why.trim().replace(/[.!?]+$/,'');
  if(amount<=0){continueAfter(after);return}
  if(player.cash>=amount){
    player.cash-=amount;
    if(creditor>=0)S.players[creditor].cash+=amount;
    const title=player.name+' '+money(amount)+' ödedi';
    log(title+(reason?' · '+reason:''));
    announceGame(title,reason+(creditor>=0?' · '+S.players[creditor].name:''),'cost');
    continueAfter(after);
  }else{
    S.debt={amount,creditor,why,after};
    phase('debt');
    S.msg=reason+': '+money(amount)+' borcun var. Bina sat, ipotek et veya iflas et.';
    announceGame(player.name+' için '+money(amount)+' borç',reason,'cost');
  }
}

function draw(type){let deck=type==='chance'?chance:finance, pile=S[type];if(!pile.length)S[type]=shuffle(deck.map((_,i)=>i));let idx=S[type].shift();let [label,action,a,b]=deck[idx],v=current();S.card={type,label:label+(action==='cash'?` ${a>0?'+':'−'}${money(Math.abs(a))}`:'')};log(`${type==='chance'?'Kader':'Kenisel'}: ${S.card.label}`);if(action==='cash'){if(a<0){charge(-a,-1,label);return}v.cash+=a;announceGame(v.name+' '+money(a)+' kazandı',label,'gain')}else if(action==='move'){moveTo(a);return}else if(action==='jail'){goJail();return}else if(action==='discount')v.discount++;else if(action==='free')v.free++;else if(action==='permit')v.permit++;else if(action==='loan'){v.cash+=200;v.loan+=250}else if(action==='repair'){let cost=assets(S.turn).reduce((s,i)=>s+(S.props[i].h===5?b:S.props[i].h*a),0);charge(cost,-1,label);return}else if(action==='perland')v.cash+=a*assets(S.turn).filter(i=>B[i].type==='land').length;else if(action==='pertransit'){charge(-a*assets(S.turn).filter(i=>B[i].type==='transit').length,-1,label);return}else if(action==='collect'){for(let id of alive().filter(i=>i!==S.turn)){let o=S.players[id];liquidate(id,a);if(o.cash>=a){o.cash-=a;v.cash+=a}else if(bankrupt(id,S.turn))return}}finish()}

function auctionStart(){if(S.phase!=='buy')return;let order=alive();let start=order.indexOf(S.turn);order=[...order.slice(start),...order.slice(0,start)];S.auction={i:current().pos,bid:0,high:-1,order,at:0,passed:[]};phase('auction');auctionCheck()}
function auctionCheck(){let a=S.auction,eligible=a.order.filter(i=>!a.passed.includes(i));if(!eligible.length||(eligible.length===1&&a.high===eligible[0])){if(a.high>=0){S.players[a.high].cash-=a.bid;S.props[a.i].owner=a.high;log(`${S.players[a.high].name} açık artırmada ${B[a.i].name} mülkünü ${money(a.bid)} bedelle aldı.`);announceGame(S.players[a.high].name+' açık artırmayı kazandı',B[a.i].name+' · '+money(a.bid),'gain')}else log('Açık artırmada teklif verilmedi.');S.auction=null;finish();return}for(let z=0;z<a.order.length;z++){let id=a.order[a.at];if(!a.passed.includes(id)&&id!==a.high){S.msg=`Açık artırma: ${B[a.i].name}. Sıra ${S.players[id].name}.`;return}a.at=(a.at+1)%a.order.length}}
function auctionAct(amount){if(S.phase!=='auction')return;let a=S.auction,id=a.order[a.at];if(amount===null)a.passed.push(id);else{amount=Math.floor(amount);if(!Number.isFinite(amount)||amount<a.bid+1||amount>S.players[id].cash)return;a.bid=amount;a.high=id;(a.history??(a.history=[])).push({id,amount});if(a.history.length>12)a.history.shift();log(`${S.players[id].name}: ${money(amount)} teklif verdi.`)}a.at=(a.at+1)%a.order.length;auctionCheck()}

function tradable(i,id){let b=B[i];return S.props[i].owner===id&&(b.type!=='land'||group(b.g).every(j=>!S.props[j].h))}



let tradeOpen=false,tradeComposerSeat=null,inboxOpen=false,inboxSeat=null,inboxOfferId=null,tradeTimer=null;
let watchedSeat=null,watchedKey=null,seatDeadline=0,seatTicker=null,refreshSeatClock=null;
const maximumSeatWait=5*60*1000;
const takeoverOptions=[[45,'45 sn'],[60,'1 dk'],[90,'1 dk 30 sn'],[120,'2 dk'],[180,'3 dk']];
function takeoverDelay(){
  const seconds=S?.takeoverSeconds;
  if(S?.autoTakeover!==true)return maximumSeatWait;
  const configured=(takeoverOptions.some(([value])=>value===seconds)?seconds:90)*1000;
  return Math.min(configured,maximumSeatWait);
}

function tradeOfferError(offer){
  const {from,to,give,take,giveCash,takeCash}=offer;
  const sender=S.players[from],receiver=S.players[to];
  if(!sender||!receiver||from===to||sender.out||receiver.out)return 'Bu oyuncu artık takas yapamaz.';
  if(![giveCash,takeCash].every(amount=>Number.isSafeInteger(amount)&&amount>=0))return 'Para tutarını tam sayı olarak yaz.';
  if(giveCash>sender.cash||takeCash>receiver.cash)return 'Taraflardan birinin parası yetersiz.';
  if([give,take].some(index=>index!==-1&&(!Number.isInteger(index)||!S.props[index])))return 'Geçersiz tapu.';
  if((give>=0&&!tradable(give,from))||(take>=0&&!tradable(take,to)))return 'Seçilen tapu artık takasa uygun değil.';
  if(give<0&&take<0&&giveCash===takeCash)return 'Bir tapu seç veya para ekle.';
  return '';
}

function resolveTrade(offer,accept){
  if(offer.status!=='pending'||moving)return;
  const error=accept?tradeOfferError(offer):'';
  offer.status=error?'expired':accept?'accepted':'declined';
  offer.note=error;
  offer.seen=false;
  recordSeatAction(offer.to);
  if(offer.status!=='accepted')return;
  const sender=S.players[offer.from],receiver=S.players[offer.to];
  sender.cash+=offer.takeCash-offer.giveCash;
  receiver.cash+=offer.giveCash-offer.takeCash;
  if(offer.give>=0)S.props[offer.give].owner=offer.to;
  if(offer.take>=0)S.props[offer.take].owner=offer.from;
  log(sender.name+' ve '+receiver.name+' takas yaptı.');
  announceGame('Takas tamamlandı',sender.name+' ve '+receiver.name,'gain');
}

function botAcceptsOffer(offer){
  const value=property=>{
    if(property<0)return 0;
    const tile=B[property];
    const matching=tile.type==='land'&&group(tile.g).some(index=>index!==property&&S.props[index].owner===offer.to);
    return tile.price*(S.props[property].mort?.5:1)*(matching?1.45:1);
  };
  return offer.giveCash+value(offer.give)>=offer.takeCash+value(offer.take)*1.12&&
    S.players[offer.to].cash-offer.takeCash+offer.giveCash>=70;
}


function expireObsoleteTradeOffers(){
  if(moving)return;
  for(const offer of S.tradeOffers??[]){
    if(offer.status!=='pending')continue;
    const {from,to,give,take}=offer;
    const usable=player=>S.players[player]&&!S.players[player].out;
    const transferable=(property,id)=>property===-1||!!S.props[property]&&tradable(property,id);
    if(usable(from)&&usable(to)&&transferable(give,from)&&transferable(take,to))continue;
    offer.status='expired';
    offer.note='Tapu veya oyuncu artık bu takasa uygun değil.';
    offer.seen=false;
  }
}
function scheduleTradeResponses(){
  if(tradeTimer||!S||(S.phase==='over'))return;
  if(!S.tradeOffers?.some(offer=>offer.status==='pending'&&S.players[offer.to]?.bot))return;
  const game=S;
  tradeTimer=setTimeout(()=>{
    tradeTimer=null;
    if(S!==game||S.phase==='over')return;
    if(!moving&&!blockingOverlay()&&S.phase!=='auction'){
      const offer=S.tradeOffers.find(entry=>entry.status==='pending'&&S.players[entry.to]?.bot);
      if(offer)resolveTrade(offer,!!tradeOfferError(offer)||botAcceptsOffer(offer));
      render();
    }else scheduleTradeResponses();
  },1200);
}

function inboxOffers(seat){
  return (S.tradeOffers??[]).filter(offer=>
    offer.status==='pending'&&offer.to===seat||
    offer.from===seat&&!offer.seen
  ).sort((a,b)=>(b.to===seat&&b.status==='pending')-(a.to===seat&&a.status==='pending')||b.id-a.id);
}

function renderTradeInbox(){
  const box=$('tradeInbox'),seat=S.turn;
  if(inboxSeat!==seat){inboxOpen=false;inboxOfferId=null;inboxSeat=seat}
  const offers=S.players[seat].bot?[]:inboxOffers(seat);
  const fresh=offers.filter(offer=>offer.to===seat&&offer.status==='pending'&&!notifiedOffers.has(offer.id));
  if(fresh.length){
    for(const offer of fresh)notifiedOffers.add(offer.id);
    announceGame('Takas teklifi geldi',S.players[seat].name+' · Teklifi sağdaki bildirimden açabilir.');
  }
  box.hidden=!offers.length;
  box.replaceChildren();
  box.classList.remove('is-important');
  if(!offers.length){inboxOpen=false;inboxOfferId=null;return}
  const index=Math.max(0,offers.findIndex(entry=>entry.id===inboxOfferId));
  const offer=offers[index],incoming=offer.to===seat;
  inboxOfferId=offer.id;
  if(!inboxOpen){
    box.classList.toggle('is-important',incoming);
    const title=incoming?'Bir takas teklifin var':offer.status==='pending'?'Teklif gönderildi':'Takasına yanıt var';
    box.append(button(title+(offers.length>1?' · '+offers.length:''),()=>{inboxOpen=true;renderTradeInbox()},{kind:'primary',render:false,duringMotion:true}));
    return;
  }
  const title=document.createElement('h3');
  box.classList.toggle('is-important',incoming);
  title.textContent=incoming?S.players[offer.from].name+' takas teklif etti':({
    pending:'Teklif bekliyor',accepted:'Teklif kabul edildi',declined:'Teklif reddedildi',expired:'Teklif artık geçerli değil',updated:'Teklif güncellendi',withdrawn:'Teklif geri çekildi'
  })[offer.status];
  box.append(title);
  if(offers.length>1){
    const pager=document.createElement('nav');
    pager.className='offer-pager';
    pager.setAttribute('aria-label','Takas bildirimleri');
    const count=document.createElement('span');
    count.textContent=(index+1)+' / '+offers.length;
    const select=direction=>{
      inboxOfferId=offers[(index+direction+offers.length)%offers.length].id;
      renderTradeInbox();
      const controls=box.querySelectorAll('.offer-pager button');
      controls[direction<0?0:1]?.focus({preventScroll:true});
    };
    pager.append(button('Önceki',()=>select(-1),{render:false,duringMotion:true}),count,
      button('Sonraki',()=>select(1),{render:false,duringMotion:true}));
    box.append(pager);
  }
  const handle=document.createElement('div');
  handle.className='window-grip';
  handle.tabIndex=0;
  handle.setAttribute('aria-label','Takas bildirimini taşı');
  box.prepend(handle);
  bindPopupDrag(box,handle,popupPositions.inbox);
  const describe=(property,cash)=>[property>=0?B[property].name:'',cash?money(cash):''].filter(Boolean).join(' + ')||'Hiçbir şey';
  const details=document.createElement('div');
  details.innerHTML='<p><b>Verirsin</b> · '+esc(describe(incoming?offer.take:offer.give,incoming?offer.takeCash:offer.giveCash))+
    '</p><p><b>Alırsın</b> · '+esc(describe(incoming?offer.give:offer.take,incoming?offer.giveCash:offer.takeCash))+'</p>'+
    (incoming?tradeImpactMarkup(seat,{otherId:offer.from,give:offer.take,take:offer.give}):'')+
    (offer.note?'<p>'+esc(offer.note)+'</p>':'');
  box.append(details);
  const actions=document.createElement('div');
  actions.className='actions';
  if(incoming){
    const ready=!moving&&S.phase!=='auction';
    actions.append(button('Kabul et',()=>{resolveTrade(offer,true);inboxOpen=false},{kind:'primary',disabled:!ready}),
      button('Reddet',()=>{resolveTrade(offer,false);inboxOpen=false},{disabled:!ready}));
  }else if(['pending','declined','expired'].includes(offer.status)){
    actions.append(button('Teklifi düzenle',()=>trade(offer),{render:false,disabled:moving||!['roll','end','debt','buy'].includes(S.phase)||!eligibleTradePartners(seat).length}));
  }
  if(!incoming&&offer.status==='pending')actions.append(button('Teklifi geri çek',()=>confirmDecision('Teklif geri çekilsin mi?','Rakip bu teklifi artık kabul edemeyecek.',()=>{
    if(offer.status!=='pending')return;
    offer.status='withdrawn';
    inboxOpen=false;
  }),{render:false}));
  actions.append(button(incoming?'Sonra bak':'Bildirimi kapat',()=>{
    if(!incoming){offer.seen=true;checkpointGame()}
    inboxOpen=false;
    inboxOfferId=null;
    renderTradeInbox();
  },{render:false,duringMotion:true}));
  box.append(actions);
  movePopup(box,popupPositions.inbox,popupPositions.inbox.x??0,popupPositions.inbox.y??0);
}

function stopSeatClock(){
  clearInterval(seatTicker);
  seatTicker=null;
  watchedSeat=null;
  watchedKey=null;
  refreshSeatClock=null;
  $('seatClock').hidden=true;
}

function delegateSeat(seat){
  const player=S?.players[seat];
  if(!player||player.bot||player.out)return;
  player.bot=true;
  S.waitingSeat=null;
  stopSeatClock();
  finishDecision(false,false);
  if(tradeOpen)close();
  log(player.name+' koltuğunu bilgisayar devraldı.');
  announceGame(player.name+' koltuğunu bot devraldı','Bekleme süresinde hamle gelmedi.');
  if(manualWait?.seat===seat)manualWait.advance();
  if(!moving)render();
}




function recordSeatAction(seat){
  if(!S||S.players[seat]?.bot||watchedSeat!==seat||!S.waitingSeat)return;
  const since=Date.now();
  S.waitingSeat.since=since;
  seatDeadline=since+takeoverDelay();
  $('seatClock').hidden=true;
}

function startSeatClock(seat,key,onTimeout,duringMotion=false){
  stopSeatClock();
  const game=S,now=Date.now(),previous=S.waitingSeat;
  const since=previous?.seat===seat&&previous.key===key&&Number.isFinite(previous.since)&&
    previous.since<=now?previous.since:now;
  S.waitingSeat={seat,key,since};
  watchedSeat=seat;
  watchedKey=key;
  seatDeadline=since+takeoverDelay();
  refreshSeatClock=()=>{
    if(S!==game){stopSeatClock();return}
    const left=Math.max(0,Math.ceil((seatDeadline-Date.now())/1000));
    const canAdvance=!moving||duringMotion;
    $('seatClock').hidden=left>12||!canAdvance;
    $('seatClockText').textContent=S.players[seat].name+' · Bot '+left+' sn sonra devralır';
    if(!left&&canAdvance){
      stopSeatClock();
      onTimeout();
    }
  };
  seatTicker=setInterval(refreshSeatClock,1000);
}

function watchHumanSeat(){
  const info=deedAttention();
  if(!info?.human){
    stopSeatClock();
    if(S.waitingSeat)S.waitingSeat=null;
    return;
  }
  const key=info.key+':'+S.phase;
  if(key===watchedKey&&seatTicker)return;
  startSeatClock(info.seat,key,()=>delegateSeat(info.seat));
}

function tradeImpacts(player,{otherId,give,take}){
  const projectedOwner=index=>index===give?otherId:index===take?player:S.props[index].owner;
  const affected=new Map();
  for(const property of [give,take]){
    if(property<0)continue;
    const report=districtReport(property);
    affected.set(report.title,report.boardSet);
  }
  return Array.from(affected,([region,tiles])=>{
    const total=tiles.length;
    const changes=[player,otherId].flatMap(id=>{
      const before=tiles.filter(index=>S.props[index].owner===id).length;
      const after=tiles.filter(index=>projectedOwner(index)===id).length;
      if(before===after)return [];
      let outcome='';
      if(after===total){
        outcome=tiles.some(index=>S.props[index].mort)?'Bölge tamamlanır, ipotekler kalır':B[tiles[0]].type==='land'?'Bölge tamamlanır · binasız kira iki katına çıkar':'Bölge tamamlanır';
      }else if(before===total)outcome='Tam bölge bozulur';
      else if(after===total-1&&after>before)outcome='Bir tapu kalır';
      if(B[tiles[0]].type==='transit'&&after>0){
        const fare=money(25*2**(after-1));
        outcome=(outcome?outcome+' · ':'')+fare+' / ipoteksiz durak';
      }
      return [{id,before,after,outcome}];
    });
    return {region,total,changes};
  }).filter(region=>region.changes.length);
}

function tradeImpactMarkup(player,offer){
  return tradeImpacts(player,offer).map(({region,total,changes})=>
    '<section class="trade-region"><strong>'+region+'</strong>'+
    changes.map(({id,before,after,outcome})=>
      '<div><span>'+esc(S.players[id].name)+'</span><b>'+before+'/'+total+' → '+after+'/'+total+'</b>'+
      (outcome?'<small>'+outcome+'</small>':'')+'</div>'
    ).join('')+'</section>'
  ).join('');
}


function eligibleTradePartners(id){
  const hasProperty=seat=>assets(seat).some(index=>tradable(index,seat));
  const mine=hasProperty(id);
  if(!mine&&S.players[id].cash<=0)return [];
  return alive().filter(seat=>{
    if(seat===id)return false;
    const theirs=hasProperty(seat);
    return (mine||theirs)&&(theirs||S.players[seat].cash>0);
  });
}
function trade(draft=null){
  if(!isHuman()||!['roll','end','debt','buy'].includes(S.phase)||moving)return;
  const id=S.turn;
  const partners=eligibleTradePartners(id);
  if(!partners.length)return;
  if(deedsOpen)closeDeeds();
  tradeOpen=true;
  tradeComposerSeat=id;


  const otherId=draft&&partners.includes(draft.otherId)?draft.otherId:partners[0];
  const allowed=(index,owner)=>index>=0&&S.props[index]&&tradable(index,owner)?index:-1;
  const choice={otherId,give:allowed(draft?.give??-1,id),take:allowed(draft?.take??-1,otherId)};
  const side=(verb,key)=>
    '<section class="trade-side"><h3>'+verb+'</h3>'+
    '<details class="trade-picker" id="'+key+'Picker"><summary id="'+key+'Selected">Mülk seç</summary>'+
    '<div class="trade-choices" id="'+key+'Choices"></div></details><div class="trade-fact" id="'+key+'Fact"></div>'+
    '<label class="trade-cash" for="'+key+'Cash">Para (isteğe bağlı)<input id="'+key+'Cash" type="number" min="0" step="1" placeholder="0 ₺"></label></section>';

  modal('<h2>Takas</h2><fieldset class="trade-partner"><legend>Kiminle?</legend><div id="tradePartners"></div></fieldset>'+
    '<div class="trade-grid">'+side('Sen verirsin','give')+side('Sen alırsın','take')+'</div>'+
    '<div class="trade-impact" id="tradeImpact" aria-live="polite" hidden></div>'+
    '<p class="trade-summary" id="tradeSummary"></p><p class="trade-error" id="tradeNote" role="status"></p>'+
    '<div class="actions"><button class="primary" id="offer">Teklif gönder</button><button id="cancel">Vazgeç</button></div>',true);
  $('giveCash').value=draft?.giveCash??'';
  $('takeCash').value=draft?.takeCash??'';

  const describe=(property,cash)=>[property>=0?B[property].name:'',cash>0?money(cash):''].filter(Boolean).join(' + ')||'Hiçbir şey';
  const read=()=>({...choice,giveCash:+$('giveCash').value,takeCash:+$('takeCash').value});

  function paintChoices(key,owner){
    const property=choice[key];
    $(key+'Selected').textContent=property<0?'Mülk seç':B[property].name;
    const container=$(key+'Choices');
    const choices=[-1,...assets(owner).filter(index=>tradable(index,owner))];
    container.replaceChildren(...choices.map(index=>{
      const option=button(index<0?'Mülk ekleme':B[index].name,()=>{
        choice[key]=index;
        $(key+'Picker').open=false;
        paintChoices(key,owner);
        preview();
        $(key+'Selected').focus({preventScroll:true});
      },{render:false});
      if(index>=0){
        option.className='trade-option';
        option.style.setProperty('--district',stripe(B[index]));
        const detail=document.createElement('small');
        detail.textContent=districtReport(index).title+' · '+money(B[index].price);
        option.append(detail);
      }
      option.setAttribute('aria-pressed',String(index===property));
      return option;
    }));
    if(choices.length===1){
      const empty=document.createElement('small');
      empty.textContent='Takasa uygun tapu yok.';
      container.append(empty);
    }
    const fact=$(key+'Fact');
    fact.hidden=property<0;
    if(property>=0){
      const deed=S.props[property],tile=B[property];
      const price=money(tile.price)+' liste fiyatı';
      const currentRent=deed.mort?'İpotekli · kira yok':tile.type==='utility'
        ? 'Kira: zar toplamı × '+(assets(deed.owner).filter(index=>B[index].type==='utility').length>1?'10':'4')
        : money(rent(property))+' mevcut kira';
      fact.style.setProperty('--district',stripe(tile));
      fact.textContent=districtReport(property).title+' · '+price+' · '+currentRent;
    }else fact.textContent='';
  }

  function renderPartners(){
    const list=$('tradePartners');
    list.replaceChildren(...partners.map(partner=>{
      const select=button(S.players[partner].name,()=>{
        choice.otherId=partner;
        choice.take=-1;
        renderPartners();
        $('takePicker').open=false;
        paintChoices('take',partner);
        preview();
        list.children[partners.indexOf(partner)]?.focus({preventScroll:true});
      },{render:false});
      select.setAttribute('aria-pressed',String(partner===choice.otherId));
      return select;
    }));
  }
  const verify=offer=>{
    const error=tradeOfferError({...offer,from:id,to:offer.otherId});
    if(error)return error;
    if(offer.give<0&&offer.take<0)return 'Takasa en az bir tapu ekle.';
    if((offer.give<0&&!offer.giveCash)||(offer.take<0&&!offer.takeCash))return 'İki taraf da tapu veya para vermeli.';
    return '';
  };
  function preview(){
    const offer=read();
    const {give,take,giveCash,takeCash}=offer;
    const empty=give<0&&take<0&&!giveCash&&!takeCash;
    $('tradeSummary').textContent=empty?'Mülk veya para seçtiğinde teklif burada görünür.':
      describe(give,giveCash)+' verirsin · '+describe(take,takeCash)+' alırsın.';
    const impact=$('tradeImpact');
    impact.innerHTML=tradeImpactMarkup(id,offer);
    impact.hidden=!impact.innerHTML;
    const error=verify(offer);
    $('tradeNote').textContent=empty?'':error;
    $('offer').disabled=!!error;
  }
  renderPartners();
  paintChoices('give',id);
  paintChoices('take',choice.otherId);
  preview();
  for(const key of ['giveCash','takeCash'])$(key).oninput=preview;
  $('cancel').onclick=()=>{close();render()};
  $('offer').onclick=()=>{
    if(S.turn!==id||moving)return;
    const data=read(),error=verify(data);
    if(error){$('tradeNote').textContent=error;return}
    const offers=S.tradeOffers??(S.tradeOffers=[]);
    const offer={...data,id:(offers.at(-1)?.id??0)+1,from:id,to:data.otherId,status:'pending',seen:false};
    if(draft){
      if(draft.status==='pending')draft.status='updated';
      draft.seen=true;
    }
    offers.push(offer);
    recordSeatAction(id);
    inboxOpen=false;
    close();
    toast(S.players[offer.to].name+' oyuncusuna teklif gönderildi.');
    render();
  };
}
let onDecision=null,decisionReturnFocus=null,decisionContext=null;
function decisionKey(){return S?[S.round,S.turn,S.phase,current().pos,S.auction?.at,S.auction?.bid].join(':'):''}
function decisionIsCurrent(){return decisionContext?.game===S&&decisionContext?.key===decisionKey()&&!moving}
function confirmDecision(title,text,action,{amount}={}){
  if(moving||!$('decisionOverlay').hidden)return;
  onDecision=action;
  decisionContext={game:S,key:decisionKey()};
  decisionReturnFocus=document.activeElement;
  $('decisionTitle').textContent=title;
  $('decisionText').textContent=text;
  const overlay=$('decisionOverlay'),price=$('decisionAmount');
  const isPurchase=Number.isFinite(amount);
  price.hidden=!isPurchase;
  price.textContent=isPurchase?money(amount):'';
  overlay.classList.toggle('purchase-reveal',isPurchase);
  overlay.hidden=false;
  $('decisionTitle').parentElement.setAttribute('aria-modal','false');
  $('decisionGrip').hidden=isPurchase;
  const dialog=$('decisionTitle').parentElement;
  dialog.style.removeProperty('translate');
  if(!isPurchase){
    const position=popupPositions.decision,x=position.x??0,y=position.y??0;
    position.x=0;position.y=0;
    movePopup(dialog,position,x,y);
  }
  $('decisionCancel').focus({preventScroll:true});
}
function finishDecision(approved,restoreFocus=true){
  if($('decisionOverlay').hidden)return;
  const action=onDecision;
  const valid=decisionIsCurrent();
  const previous=decisionReturnFocus;
  onDecision=null;
  decisionContext=null;
  decisionReturnFocus=null;
  $('decisionOverlay').hidden=true;
  $('decisionOverlay').classList.remove('purchase-reveal');
  if(approved&&valid){action();if(!blockingOverlay())render()}
  else if(restoreFocus&&previous?.isConnected)previous.focus({preventScroll:true});
}
function confirmDeed(index,title,description,action,refresh){
  confirmDecision(title,B[index].name+' · '+description,()=>{
    action(index);
    refresh();
  });
}

gage,refresh),{disabled:current().cash<releaseCost(index)||S.phase==='debt'}):button('İpotek et',()=>confirmDeed(index,'Tapu ipotek edilsin mi?',money(Math.floor(b.price/2))+' alacaksın. İpotek kalkana kadar kira alınmaz.',mortgage,refresh),{disabled:!canMortgage(index)}))}}

let deedsOpen=false,lastHuman=0,activeDeed=null,suspendedDeed=null,suspendedPanels=null,attentionDecision=null;
function deedStatus(index){
  const {h,mort}=S.props[index];
  return [h===5?'Otel':h?h+' ev':'',mort?'İpotekli':''].filter(Boolean).join(' · ');
}
function setGamePanel(open,focus=true){
  $('gamePanel').hidden=!open;
  $('gamePanelOpen').setAttribute('aria-expanded',String(open));
  if(open){
    const panel=$('gamePanel'),position=popupPositions.gamePanel;
    if(position.width)resizeGamePanel(position.width,position.height);
    else movePopup(panel,position,position.x??0,position.y??0);
  }
  if(focus)(open?$('gamePanelClose'):$('gamePanelOpen')).focus({preventScroll:true});

function deedAttention(){
  if(!S||S.phase==='over')return null;
  const auction=S.phase==='auction'?S.auction:null;
  const seat=auction?auction.order[auction.at]:S.turn;
  return {seat,human:!S.players[seat].bot,key:auction?'auction:'+seat:S.round+':'+seat};
}

function suspendDeeds(seat,auto){
  if(!activeDeed)return;
  activeDeed.scroll=$('deedBody').scrollTop;
  activeDeed.listScroll=$('deedList').scrollTop;
  suspendedDeed={view:activeDeed,seat,auto};
  close();

}

function resumeDeeds(focus=true){
  if(!suspendedDeed||moving||blockingOverlay())return;
  const {view}=suspendedDeed;
  suspendedDeed=null;
  showDeeds(view,focus);
}


function suspendBrowsing(seat){
  const panel=$('gamePanel'),settings=$('gameSettings');
  if(!panel.hidden||!settings.hidden){
    suspendedPanels={
      seat,
      panel:!panel.hidden||!!suspendedPanels?.panel,
      settings:!settings.hidden||!!suspendedPanels?.settings,
      panelScroll:panel.hidden?suspendedPanels?.panelScroll:$('players').scrollTop,
      settingsScroll:settings.hidden?suspendedPanels?.settingsScroll:settings.scrollTop
    };
    setGamePanel(false,false);
    setSettings(false,false);
  }

}


function restorePanels(target=null,focus=false){
  if(!suspendedPanels)return;
  const saved=suspendedPanels;
  if(saved.panel&&(!target||target==='panel')){
    setGamePanel(true,focus);
    $('players').scrollTop=saved.panelScroll??0;
    saved.panel=false;
  }
  if(saved.settings&&(!target||target==='settings')){
    setSettings(true,focus);
    $('gameSettings').scrollTop=saved.settingsScroll??0;
    saved.settings=false;
  }
  if(!saved.panel&&!saved.settings)suspendedPanels=null;
}

function browsingTarget(){
  if(suspendedDeed)return 'deed';
  if(suspendedPanels?.settings)return 'settings';
  if(suspendedPanels?.panel)return 'panel';
  return null;
}
function updateBrowsingButton(){
  const resume=$('resumeDeeds'),target=browsingTarget();
  resume.hidden=!target||moving;
  resume.textContent=({deed:'Tapuya dön',settings:'Ayarları yeniden aç',panel:'Oyun panelini yeniden aç'})[target]??'';
}
function returnToBrowsing(){
  if(moving)return;
  const target=browsingTarget();
  if(target==='deed'){
    resumeDeeds();

const districtNames=['Açık mavi','Sarı','Yeşil','Pembe','Lacivert','Kırmızı','Kahverengi','Turuncu'];

function districtReport(index){
  const tile=B[index];
  if(!S||!ownable(tile))return null;
  const landGroup=tile.type==='land';
  const boardSet=landGroup?group(tile.g):B.flatMap((entry,id)=>entry.type===tile.type?[id]:[]);
  const owners=S.players.map((_,id)=>boardSet.filter(property=>S.props[property].owner===id).length);
  const title=landGroup?districtNames[tile.g]+' bölge':tile.type==='transit'?'Ulaşım grubu':'Hizmet grubu';
  const allRents=boardSet.map(id=>{
    if(landGroup)return landRent(B[id],0,true);
    if(tile.type==='transit')return 25*2**(boardSet.length-1);
    return null;
  });
  const bankCount=boardSet.filter(id=>S.props[id].owner<0).length;
  const bankTotal=boardSet.reduce((sum,id)=>sum+(S.props[id].owner<0?B[id].price:0),0);
  return {boardSet,owners,title,allRents,bankCount,bankTotal};
}

const popupPositions={modal:{},trade:{},settings:{},decision:{},inbox:{},gamePanel:{},turnCue:{},turnDock:{},turnLanding:{}};

function movePopup(dialog,view,x,y){
  const rect=dialog.getBoundingClientRect();
  const originX=rect.left-(view.x??0),originY=rect.top-(view.y??0);
  const root=document.documentElement,layout=$('gameLayout');
  const gameWindow=dialog===$('turnPanel')||dialog===$('turnCue');
  const bounds=gameWindow&&layout.classList.contains('deed-split')?$('playArea').getBoundingClientRect():
    {left:0,top:Math.max(0,layout.getBoundingClientRect().top),right:root.clientWidth,bottom:Math.min(root.clientHeight,layout.getBoundingClientRect().bottom)};
  const minX=bounds.left+6-originX,maxX=bounds.right-6-rect.width-originX;
  const minY=bounds.top+6-originY,maxY=bounds.bottom-6-rect.height-originY;
  view.x=Math.max(minX,Math.min(x,maxX));
  view.y=Math.max(minY,Math.min(y,maxY));
  dialog.style.setProperty('translate',view.x+'px '+view.y+'px');
}

function bindPopupDrag(dialog,handle,position,bar=handle,onDragStart=null){
  let drag=null;
  const getView=()=>typeof position==='function'?position():position;
  bar.addEventListener('pointerdown',event=>{
    if(event.button!==0||!event.isPrimary||event.target.closest('button,input,select,textarea,a,summary'))return;
    const view=getView();
    drag={id:event.pointerId,view,startX:event.clientX,startY:event.clientY,started:false};
    bar.setPointerCapture(event.pointerId);
  });
  bar.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    if(!drag.started){
      if(Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)<4)return;
      onDragStart?.();
      drag.started=true;
      drag.x=drag.startX-(drag.view.x??0);
      drag.y=drag.startY-(drag.view.y??0);
    }
    movePopup(dialog,drag.view,event.clientX-drag.x,event.clientY-drag.y);
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture']){
    bar.addEventListener(event,entry=>{if(drag?.id===entry.pointerId)drag=null});
  }
  handle.addEventListener('keydown',event=>{
    const directions={ArrowLeft:[-24,0],ArrowRight:[24,0],ArrowUp:[0,-24],ArrowDown:[0,24]};
    if(!directions[event.key])return;
    event.preventDefault();
    onDragStart?.();
    const [x,y]=directions[event.key],view=getView();
    movePopup(dialog,view,(view.x??0)+x,(view.y??0)+y);
  });
}


function resizeGamePanel(width,height){
  const panel=$('gamePanel'),position=popupPositions.gamePanel;
  const available=$('gameLayout').getBoundingClientRect();
  const previous=panel.getBoundingClientRect();
  const maxWidth=Math.max(1,available.width-12),maxHeight=Math.max(1,available.height-12);
  position.width=Math.min(maxWidth,Math.max(Math.min(230,maxWidth),Math.round(width)));
  position.height=Math.min(maxHeight,Math.max(Math.min(220,maxHeight),Math.round(height)));
  panel.style.width=position.width+'px';
  panel.style.height=position.height+'px';
  const next=panel.getBoundingClientRect();
  const x=(position.x??0)+previous.left-next.left;
  const y=(position.y??0)+previous.top-next.top;
  movePopup(panel,position,x,y);
}
function initGamePanelResize(){
  const panel=$('gamePanel'),grip=$('gamePanelResize');
  let drag;
  grip.addEventListener('pointerdown',event=>{
    if(!event.isPrimary||event.button!==0)return;
    const box=panel.getBoundingClientRect();
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,width:box.width,height:box.height};
    grip.setPointerCapture(event.pointerId);
  });
  grip.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    resizeGamePanel(drag.width+event.clientX-drag.x,drag.height+event.clientY-drag.y);
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture']){
    grip.addEventListener(event,entry=>{if(drag?.id===entry.pointerId)drag=null});
  }
  grip.addEventListener('keydown',event=>{
    const deltas={ArrowLeft:[-20,0],ArrowRight:[20,0],ArrowUp:[0,-20],ArrowDown:[0,20]};
    if(!deltas[event.key])return;
    event.preventDefault();
    const [x,y]=deltas[event.key],box=panel.getBoundingClientRect();
    resizeGamePanel(box.width+x,box.height+y);
  });
}

function initDeedWindow(view){
  const dialog=$('modal'),handle=$('deedDrag'),minimize=$('deedMinimize'),dockToggle=$('deedDockToggle');
  function applyPlacement(){
    const docked=!view.floating&&!view.minimized;
    const x=view.x??0,y=view.y??0;
    dialog.style.removeProperty('translate');
    dialog.classList.toggle('deed-collapsed',!!view.minimized);

    if(!docked){
      view.x=0;view.y=0;
      moveDeedWindow(view,x,y);
    }
  }
  function detach(){
    if(view.floating||view.minimized)return;
    const previous=dialog.getBoundingClientRect();
    view.floating=true;
    applyPlacement();
    const position=dialog.getBoundingClientRect();
    moveDeedWindow(view,(view.x??0)+previous.left-position.left,(view.y??0)+previous.top-position.top);
  }
  bindPopupDrag(dialog,handle,view,handle.closest('.deed-head'),detach);
  dockToggle.onclick=()=>{view.floating=!view.floating;view.minimized=false;applyPlacement()};
  minimize.onclick=()=>{view.minimized=!view.minimized;applyPlacement()};
  applyPlacement();
}

function turnLabel(name){
  const spoken=name.trim().toLocaleLowerCase('tr-TR').replace(/[^\p{L}0-9]+$/u,'');
  const numbers=['sıfır','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'];
  const digits=spoken.match(/[0-9]+$/)?.[0];
  const nonzero=digits?.replace(/0+$/,'');
  const zeros=digits&&nonzero?digits.length-nonzero.length:0;
  let ending=spoken;
  if(digits){
    const unit=Number(nonzero?.at(-1)??0);
    if(zeros===0)ending=numbers[unit];
    else if(zeros===1)ending=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'][unit];
    else if(zeros===2)ending='yüz';
    else ending=['','bin','milyon','milyar','trilyon','katrilyon','kentilyon','sekstilyon'][Math.floor(zeros/3)]??'ilyon';
  }
  const vowels=ending.match(/[aeıioöuü]/g);
  const vowel=vowels?.at(-1);
  const harmonic=({a:'ın',ı:'ın',e:'in',i:'in',o:'un',u:'un',ö:'ün',ü:'ün'})[vowel]??'in';
  const buffer=ending==='su'?'y':(/[aeıioöuü]$/.test(ending)?'n':'');
  return name+'’'+buffer+harmonic+' sırası';
}

  if(bidder.bot){showComputerAction(actions,bidder.name+' teklif sırası');return}

  const entry=document.createElement('div');
  entry.className='auction-entry';
  const input=document.createElement('input');
  input.type='number';
  input.inputMode='numeric';
  input.required=true;
  input.min=min;
  input.max=bidder.cash;
  input.step=1;
  if(auctionDraft?.auction!==auction||auctionDraft?.seat!==id||auctionDraft?.bid!==auction.bid){
    auctionDraft={auction,seat:id,bid:auction.bid,value:String(Math.min(Math.max(min,auction.bid+10),bidder.cash))};
  }
  input.value=auctionDraft.value;
  input.setAttribute('aria-label','Teklif tutarı');
  const balance=document.createElement('output');
  balance.className='auction-balance';
  const submit=button('Teklif ver',()=>{
    if(!input.reportValidity())return;
    const offer=+input.value;
    confirmDecision('Teklif verilsin mi?',B[auction.i].name+' için '+money(offer)+' teklif edeceksin. Kazanırsan '+money(bidder.cash-offer)+' paran kalacak.',()=>auctionAct(offer));
  },{kind:'primary',render:false});
  function showBalance(){
    const value=+input.value;
    const valid=input.value!==''&&Number.isSafeInteger(value)&&value>=min&&value<=bidder.cash;
    submit.disabled=!valid;
    balance.textContent=valid?'Kazanırsan '+money(bidder.cash-value)+' kalır.':bidder.cash<min?'Nakit en düşük teklife yetmiyor.':'En az '+money(min)+' teklif verilebilir.';
  }
  input.oninput=()=>{auctionDraft.value=input.value;showBalance()};
  input.onkeydown=event=>{
    if(event.key!=='Enter'&&event.code!=='NumpadEnter')return;
    event.preventDefault();
    event.stopPropagation();
    if(!event.repeat&&!submit.disabled)submit.click();
  };
  entry.append(input);
  for(const delta of [1,10,50]){
    entry.append(button('+'+delta+' ₺',()=>{input.value=auction.bid+delta;auctionDraft.value=input.value;showBalance()},{
      disabled:auction.bid+delta>bidder.cash,render:false
    }));
  }
  entry.append(balance);
  actions.append(entry,submit,button('Çekil',()=>confirmDecision('Açık artırmadan çekilmek istiyor musun?','Bu tapu için tekrar teklif veremeyeceksin.',()=>auctionAct(null)),{render:false}));
  showBalance();
}

rtı',()=>confirmDecision('Çıkış kartı kullanılsın mı?','Bir cezaevinden çıkış kartı harcanacak.',()=>jailExit(true)),{disabled:!v.free}))}}else if(S.phase==='buy'){a.append(button('Satın al · '+money(B[v.pos].price),()=>confirmDecision('Satın almak istiyor musun?',B[v.pos].name+' tapusu senin olacak.',buy,{amount:B[v.pos].price}),{kind:'primary',disabled:v.cash<B[v.pos].price}),button('Açık artırma',()=>confirmDecision('Açık artırma başlasın mı?',B[v.pos].name+' için herkes teklif verebilir.',auctionStart)))}else if(S.phase==='end'){a.append(button('Turu bitir',nextTurn,{kind:'primary'}))}else if(S.phase==='debt'){a.append(button('Borcu öde',()=>confirmDecision('Borç ödensin mi?',money(S.debt.amount)+' ödenecek.',payDebt),{kind:'primary',disabled:v.cash<S.debt.amount}),button('Tapuları yönet',()=>openDeeds(S.turn),{render:false}),button('İflas / tasfiye',()=>confirmDecision('Tasfiye başlasın mı?',money(S.debt.amount)+' borcu kapatmak için varlıkların elden çıkarılacak. Borç karşılanamazsa iflas edersin.',declare),{kind:'danger'}))}if(eligibleTradePartners(S.turn).length)a.append(button('Takas',trade));if(v.free||v.discount||v.permit){let s=document.createElement('div');s.className='hint';s.style.width='100%';s.textContent=`Kartlar: ${v.free} çıkış · ${v.discount} kira indirimi · ${v.permit} imar izni`;a.append(s)}}

function botPropertyBudget(index,id,auction=false){
  const tile=B[index],player=S.players[id],report=districtReport(index);
  const owned=report.owners[id],total=report.boardSet.length;
  const completes=total>1&&owned===total-1;
  const blocks=total>1&&report.owners.some((count,seat)=>seat!==id&&count===total-1);
  const reserve=completes?70:blocks?110:145;
  const fairValue=tile.price*(completes?1.48:blocks?1.22:owned?1.10:auction?.95:1);
  return Math.min(player.cash-reserve,Math.floor(fairValue));
}

function botStep(){if(moving||!S||buildingThisTurn()||blockingOverlay()||S.phase==='over')return;clearBotTimer();if(S.phase==='auction'){let a=S.auction,id=a.order[a.at],v=S.players[id],cap=botPropertyBudget(a.i,id,true);let amount=a.bid+Math.max(1,Math.min(10,cap-a.bid));auctionAct(cap>=a.bid+1?amount:null);render();return}let v=current();if(!v.bot)return;if(S.phase==='roll'){if(v.jailed&&(v.free||v.cash>350))jailExit(!!v.free);roll()}else if(S.phase==='buy'){let b=B[v.pos];if(botPropertyBudget(v.pos,S.turn)>=b.price)buy();else auctionStart()}else if(S.phase==='debt'){liquidate(S.turn,S.debt.amount);if(v.cash>=S.debt.amount)payDebt();else declare()}else if(S.phase==='end'){for(let i of assets(S.turn)){if(v.cash>releaseCost(i)+300&&S.props[i].mort)unmortgage(i);if(canBuild(i)&&v.cash>buildCost(B[i].g)+300){build(i);break}}nextTurn()}render()}
$('promptRoll').onclick=roll;$('saveBtn').onclick=save;$('newBtn').onclick=setup;$('rulesBtn').onclick=()=>{modal(`<h2>Nasıl oynanır?</h2><p>2–6 oyuncu, kişi başı 1.500 ₺. Sırayla iki zar atılır. Başlangıçtan geçildiğinde 200 ₺ alınır. Sahipsiz mülkü al veya açık artırmaya çıkar. Rakip mülkünde kira öde.</p><p>Bir renk grubunun tüm arsalarını alıp ipoteklerini kaldırınca eşit şekilde ev yap. Dört evden sonra aynı bedelle otel yap. Evler yarı bedelle satılır. Boş gruptaki mülkler yarı fiyatına ipotek edilebilir; %10 faizle geri alınır. Küsuratlı tutarlar tam liraya yuvarlanır.</p><p>Çift zar tekrar oynatır; üst üste üç çift cezaevi. Cezaevinden 50 ₺, çıkış kartı veya çift zar ile çıkılır; üçüncü başarısız zar sonunda 50 ₺ ödenir. Kader ve Kenisel kartları otomatik uygulanır. Kredi sonraki Başlangıç geçişinde ödenir. Ödeme yapılamazsa bina satışı, ipotek ve takas yapılabilir. Son kalan kazanır.</p><p>Arkadaşlarla aynı cihazda sıra ile oynayabilirsin. Bilgisayar rakipleri mülk alır, teklif verir, takas değerlendirir ve bina yapar. İflasta alacaklıya kalan mülkler devredilir; banka alacaklıysa mülkler satışa döner.</p><button id="closeRules" class="primary">Kapat</button>`);$('closeRules').onclick=()=>{close();render()}};$('camL').onclick=()=>{angle-=12;camera()};$('camR').onclick=()=>{angle+=12;camera()};$('camFlat').onclick=()=>{tilt=tilt?0:30;if(!tilt)angle=0;camera()};$('camReset').onclick=showWholeBoard;$('camIn').onclick=()=>adjustZoom(1.25);$('camOut').onclick=()=>adjustZoom(.8);$('camFollow').onclick=toggleFollow;new ResizeObserver(camera).observe($('stage'));$('gamePanelOpen').onclick=()=>{if(S)setGamePanel($('gamePanel').hidden)};

const soundStorageKey='demirkapipoly-sound-v1';
const soundOptions={music:true,effects:true,musicVolume:28,effectsVolume:45};
try{
  const saved=JSON.parse(localStorage.getItem(soundStorageKey));
  for(const key of ['music','effects'])if(typeof saved?.[key]==='boolean')soundOptions[key]=saved[key];
  for(const key of ['musicVolume','effectsVolume'])if(Number.isFinite(saved?.[key]))soundOptions[key]=Math.max(0,Math.min(100,saved[key]));
}catch{}
const gameSound=window.createToyAudio?.(soundOptions);
for(const [toggleId,volumeId,channel] of [['musicEnabled','musicVolume','music'],['effectsEnabled','effectsVolume','effects']]){
  const toggle=$(toggleId),slider=$(volumeId);
  toggle.checked=soundOptions[channel];
  slider.value=soundOptions[volumeId];
  function change(){
    soundOptions[channel]=toggle.checked;
    soundOptions[volumeId]=Number(slider.value);
    gameSound?.configure(soundOptions);
    try{localStorage.setItem(soundStorageKey,JSON.stringify(soundOptions))}catch{}
  }
  toggle.onchange=change;
  slider.oninput=change;
}
